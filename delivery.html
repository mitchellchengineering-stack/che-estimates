<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CH Delivery</title>
<meta name="theme-color" content="#1f1f1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CH Delivery">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="delivery.webmanifest">
<link rel="icon" type="image/png" href="chd-icon-192.png">
<link rel="apple-touch-icon" href="chd-apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
  :root { --ink: #15171a; --char: #1f1f1f; --y: #f5c400; --bg: #f4f4f2; --line: #d9dde0; --mut: #5c636b; --green: #1e6b31; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: Archivo, -apple-system, "Segoe UI", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  body { min-height: 100vh; }
  button, input, textarea { font: inherit; color: inherit; }
  .top { background: var(--char); color: #fff; padding: calc(14px + env(safe-area-inset-top, 0px)) 16px 14px; display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 5; }
  .top .mk { font-weight: 900; font-size: 18px; } .top .mk i { color: var(--y); font-style: normal; }
  .top .tag { font-size: 11px; font-weight: 800; letter-spacing: .14em; color: var(--y); }
  .top .r { margin-left: auto; font-size: 13px; color: #c9ced3; background: none; border: 0; padding: 6px; }
  .top .back { background: none; border: 0; color: var(--y); font-size: 28px; line-height: 1; padding: 0 6px 0 0; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 14px 14px calc(30px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; }
  .card { background: #fff; border-radius: 16px; padding: 14px; }
  .big { height: 56px; width: 100%; border-radius: 14px; border: 0; font-weight: 800; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; cursor: pointer; }
  .big.y { background: var(--y); color: var(--ink); } .big.d { background: var(--ink); color: #fff; } .big.w { background: #fff; color: var(--ink); border: 1.5px solid var(--line); }
  .big:disabled { opacity: .45; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .seg { display: flex; background: #e8eae7; border-radius: 12px; padding: 4px; gap: 4px; }
  .seg button { flex: 1; height: 38px; border: 0; border-radius: 9px; background: transparent; font-weight: 600; font-size: 14px; }
  .seg button.on { background: #fff; font-weight: 800; }
  .day { margin: 2px 2px 0; font-size: 12px; font-weight: 800; letter-spacing: .06em; color: var(--mut); }
  .load { display: block; width: 100%; text-align: left; border: 0; background: #fff; border-radius: 16px; padding: 14px; border-left: 6px solid var(--y); cursor: pointer; }
  .load.done { border-left-color: var(--green); } .load.pend { border-left-color: #2a6fb0; }
  .load .h { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; font-weight: 800; }
  .pill { font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 6px; background: #fff3c4; color: #8a6d00; white-space: nowrap; }
  .pill.ok { background: #e2f2e6; color: var(--green); } .pill.blue { background: #e4eefa; color: #1f5a96; }
  .addr { margin: 6px 0 2px; font-size: 18px; font-weight: 800; line-height: 1.2; }
  .mut { margin: 0; font-size: 13px; color: var(--mut); line-height: 1.45; }
  h2 { margin: 0; font-size: 22px; line-height: 1.15; }
  h3 { margin: 0 0 8px; font-size: 15px; }
  .photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px; }
  .photos span { position: relative; } .photos img { width: 100%; height: 86px; object-fit: cover; border-radius: 10px; display: block; }
  .photos button { position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border-radius: 50%; border: 0; background: rgba(255,255,255,.92); font-weight: 800; }
  .opt { display: flex; gap: 12px; align-items: center; width: 100%; padding: 14px; border-radius: 14px; border: 1.5px solid var(--line); background: #fff; font-weight: 600; font-size: 15px; text-align: left; cursor: pointer; }
  .opt.on { border: 2px solid var(--ink); background: #fff9e0; font-weight: 800; }
  .opt i { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--ink); flex: none; } .opt.on i { background: radial-gradient(var(--ink) 45%, transparent 50%); }
  label.f { display: block; font-size: 12px; font-weight: 800; color: var(--mut); letter-spacing: .04em; margin: 10px 0 6px; }
  input.t, textarea.t { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 12px; font-size: 16px; background: #fff; }
  .sig { position: relative; } .sig canvas { width: 100%; height: 180px; border: 2px dashed #c4cacf; border-radius: 14px; background: #fff; touch-action: none; display: block; }
  .sig button { position: absolute; top: 8px; right: 8px; border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 6px 10px; font-weight: 700; font-size: 13px; }
  .warn { background: #fff3c4; border-radius: 12px; padding: 10px 12px; font-size: 13px; color: #5c4a00; }
  .err { background: #fbe6e4; color: #b3261e; border-radius: 12px; padding: 10px 12px; font-size: 13.5px; }
  .login { background: var(--char); color: #fff; min-height: 100vh; padding: calc(60px + env(safe-area-inset-top, 0px)) 22px 30px; display: flex; flex-direction: column; align-items: center; }
  .login img { width: 96px; height: 96px; border-radius: 24px; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
  .login h1 { margin: 20px 0 4px; font-size: 26px; } .login p { margin: 0 0 24px; color: #c9ced3; font-size: 14px; text-align: center; }
  .login .box { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 12px; }
  .login input { width: 100%; height: 54px; border-radius: 12px; border: 0; background: #2b2d31; color: #fff; padding: 0 16px; font-size: 17px; }
  .login input.pin { text-align: center; letter-spacing: .5em; font-size: 24px; font-weight: 800; }
  .done { text-align: center; padding-top: 50px; }
  .tick { width: 88px; height: 88px; border-radius: 50%; background: var(--green); color: #fff; font-size: 46px; font-weight: 900; display: flex; align-items: center; justify-content: center; margin: 0 auto; }
  .list p { margin: 0; padding: 4px 0; font-size: 14.5px; }
  .empty { text-align: center; padding: 40px 10px; color: var(--mut); }
  .q { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: #1f5a96; color: #fff; padding: 10px 16px; border-radius: 14px; font-size: 13.5px; font-weight: 700; box-shadow: 0 8px 24px rgba(0,0,0,.25); z-index: 9; }
  :focus-visible { outline: 3px solid var(--y); outline-offset: 2px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
(() => {
  const $app = document.getElementById('app');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const LS = { get: k => { try { return JSON.parse(localStorage.getItem('chd.' + k)); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem('chd.' + k, JSON.stringify(v)); } catch (e) {} }, del: k => localStorage.removeItem('chd.' + k) };
  /* the helper link comes in the link the office sends (?h=…), then it's remembered */
  const qs = new URLSearchParams(location.search);
  if (qs.get('h')) { LS.set('helper', `https://script.google.com/macros/s/${qs.get('h')}/exec`); history.replaceState(null, '', location.pathname); }
  const S = { helper: LS.get('helper'), me: LS.get('me'), day: 'today', loads: [], loading: false, error: '', cur: null, photos: [], signer: 'client', sigDirty: false, name: '', where: '' };
  const iso = d => { const x = new Date(d); x.setMinutes(x.getMinutes() - x.getTimezoneOffset()); return x.toISOString().slice(0, 10); };
  const today = () => iso(new Date()); const add = (s, n) => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return iso(d); };
  const days = () => ({ yesterday: add(today(), -1), today: today(), tomorrow: add(today(), 1) });
  const nice = s => new Date(s + 'T12:00:00').toLocaleDateString('en-NZ', { weekday: 'long', day: 'numeric', month: 'long' }).toUpperCase();
  async function api(action, body = {}) {
    if (!S.helper) throw new Error('This app needs setting up. Open the link the office sent you.');
    const r = await fetch(S.helper, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action, name: S.me && S.me.name, pin: S.me && S.me.pin }, body)) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error === 'bad_pin' ? 'That name and PIN don\u2019t match. Check with the office.' : j.error || 'Something went wrong.');
    return j;
  }

  /* ---------- a queue on the phone, so deliveries send when there's signal ---------- */
  const DB = { db: null,
    open() { return this.db || (this.db = new Promise((res, rej) => { const r = indexedDB.open('ch-delivery', 1); r.onupgradeneeded = () => r.result.createObjectStore('q', { keyPath: 'uid' }); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); })); },
    async tx(mode, fn) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('q', mode); const st = t.objectStore('q'); const out = fn(st); t.oncomplete = () => res(out && out.result !== undefined ? out.result : out); t.onerror = () => rej(t.error); }); },
    put(x) { return this.tx('readwrite', s => s.put(x)); }, del(k) { return this.tx('readwrite', s => s.delete(k)); },
    async all() { const db = await this.open(); return new Promise((res, rej) => { const r = db.transaction('q').objectStore('q').getAll(); r.onsuccess = () => res(r.result || []); r.onerror = () => rej(r.error); }); } };
  let sending = false; S.queue = [];
  async function flush() {
    if (sending) return; sending = true;
    try {
      S.queue = await DB.all();
      for (const x of S.queue) {
        try {
          x.photoIds = x.photoIds || [];
          for (let i = x.photoIds.length; i < x.photos.length; i++) { const r = await api('dphoto', { number: x.number, n: x.n, data: x.photos[i], fileName: `${x.number} load ${x.n} photo ${i + 1}.jpg` }); x.photoIds.push(r.id); await DB.put(x); }
          if (!x.sigId) { const r = await api('dphoto', { number: x.number, n: x.n, data: x.sig, fileName: `${x.number} load ${x.n} signature.png` }); x.sigId = r.id; await DB.put(x); }
          await api('dcomplete', { uid: x.uid, jobId: x.jobId, loadId: x.loadId, number: x.number, n: x.n, at: x.at, signer: x.signer, sigId: x.sigId, photoIds: x.photoIds });
          await DB.del(x.uid);
        } catch (er) { if (!navigator.onLine || /Failed to fetch|NetworkError|Load failed/i.test(er.message)) break; x.lastError = er.message; await DB.put(x); }
      }
      S.queue = await DB.all();
    } finally { sending = false; badge(); }
  }
  function badge() {
    let el = document.getElementById('q'); const n = S.queue.length;
    if (!n) { if (el) el.remove(); return; }
    if (!el) { el = document.createElement('div'); el.id = 'q'; el.className = 'q'; document.body.appendChild(el); }
    el.textContent = navigator.onLine ? `Sending ${n} deliver${n === 1 ? 'y' : 'ies'}\u2026` : `${n} deliver${n === 1 ? 'y' : 'ies'} saved, will send when there's signal`;
  }
  window.addEventListener('online', () => { flush(); }); setInterval(() => { if (S.queue.length) flush(); }, 30000);

  /* ---------- screens ---------- */
  const top = (right, back) => `<header class="top">${back ? `<button class="back" data-go="${back}" aria-label="Back">\u2039</button>` : ''}<span class="mk">CH<i>.</i></span><span class="tag">DELIVERY</span>${right || ''}</header>`;
  function render() {
    if (!S.me) return loginView();
    if (S.view === 'load' && S.cur) return loadView();
    if (S.view === 'sign' && S.cur) return signView();
    if (S.view === 'done') return doneView();
    return listView();
  }
  function loginView() {
    const names = LS.get('names') || [];
    $app.innerHTML = `<div class="login"><img src="chd-icon-192.png" alt=""><h1>CH Delivery</h1><p>Sign in to see your deliveries</p>
      <div class="box">${!S.helper ? '<div class="err">Open this app from the link the office sent you, so it can connect.</div>' : ''}
      <input id="ln" placeholder="Your name" autocomplete="username" value="${esc(names[0] || '')}" aria-label="Your name">
      <input id="lp" class="pin" placeholder="PIN" inputmode="numeric" type="password" maxlength="6" autocomplete="current-password" aria-label="PIN">
      <button class="big y" id="lb">Sign in</button><div id="le"></div><p style="font-size:12.5px">Your name and PIN. The office sets these up.</p></div></div>`;
    document.getElementById('lb').onclick = async () => {
      const name = document.getElementById('ln').value.trim(), pin = document.getElementById('lp').value.trim();
      if (!name || !pin) return;
      S.me = { name, pin }; document.getElementById('lb').disabled = true;
      try { const r = await api('dlogin'); S.me.name = r.name; LS.set('me', S.me); LS.set('names', [r.name]); S.view = 'list'; load(); }
      catch (er) { S.me = null; document.getElementById('le').innerHTML = `<div class="err">${esc(er.message)}</div>`; document.getElementById('lb').disabled = false; }
    };
  }
  async function load() {
    S.loading = true; S.error = ''; render();
    try { const d = days(); const r = await api('dloads', { days: [d.yesterday, d.today, d.tomorrow] }); S.loads = r.loads; LS.set('loads', { at: Date.now(), loads: r.loads }); }
    catch (er) { S.error = er.message; const c = LS.get('loads'); if (c) S.loads = c.loads; if (/match/.test(er.message)) { S.me = null; LS.del('me'); } }
    S.loading = false; S.queue = await DB.all().catch(() => []); render(); badge(); flush();
  }
  function listView() {
    const d = days()[S.day]; const list = S.loads.filter(l => l.date === d); const pend = new Set(S.queue.map(q => q.jobId + '|' + q.loadId));
    $app.innerHTML = `${top(`<button class="r" id="out">${esc(S.me.name)} \u00b7 Sign out</button>`)}<main class="wrap">
      <div class="seg">${[['yesterday', 'Yesterday'], ['today', 'Today'], ['tomorrow', 'Tomorrow']].map(([k, l]) => `<button data-day="${k}" class="${S.day === k ? 'on' : ''}">${l}</button>`).join('')}</div>
      <p class="day">${nice(d)} \u00b7 ${list.length} LOAD${list.length === 1 ? '' : 'S'}</p>
      ${S.error ? `<div class="err">${esc(S.error)}${S.loads.length ? ' Showing the last list saved on this phone.' : ''}</div>` : ''}
      ${S.loading && !S.loads.length ? '<p class="empty">Loading your deliveries\u2026</p>' : list.length ? list.map((l, i) => { const p = pend.has(l.jobId + '|' + l.loadId); return `<button class="load ${l.delivered ? 'done' : p ? 'pend' : ''}" data-load="${esc(l.jobId + '|' + l.loadId)}">
        <span class="h"><span>${esc(l.number)} \u00b7 Load ${l.n} of ${l.of}</span>${l.delivered ? '<span class="pill ok">Delivered</span>' : p ? '<span class="pill blue">Sending</span>' : '<span class="pill">To go</span>'}</span>
        <p class="addr">${esc(l.site || 'No site address')}</p><p class="mut">${esc(l.client)}${l.contact && l.contact !== l.client ? ', ' + esc(l.contact) : ''}<br>${l.count} item${l.count === 1 ? '' : 's'}${l.kg ? ' \u00b7 ' + l.kg.toLocaleString('en-NZ') + ' kg' : ''}</p></button>`; }).join('') : '<p class="empty">No deliveries booked for this day.</p>'}
      <button class="big w" id="rf">Refresh</button></main>`;
    document.getElementById('out').onclick = () => { if (confirm('Sign out of CH Delivery?')) { S.me = null; LS.del('me'); render(); } };
    document.getElementById('rf').onclick = load;
    $app.querySelectorAll('[data-day]').forEach(b => b.onclick = () => { S.day = b.dataset.day; render(); });
    $app.querySelectorAll('[data-load]').forEach(b => b.onclick = () => { const [j, l] = b.dataset.load.split('|'); S.cur = S.loads.find(x => x.jobId === j && x.loadId === l); S.photos = (LS.get('ph.' + l) || []); S.view = 'load'; render(); scrollTo(0, 0); });
  }
  function loadView() {
    const l = S.cur; const map = l.site ? `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(l.site)}` : '';
    const sent = S.queue.some(q => q.loadId === l.loadId);
    $app.innerHTML = `${top(`<span class="r">Load ${l.n} of ${l.of}</span>`, 'list')}<main class="wrap">
      <div><p class="mut" style="font-weight:700">${esc(l.number)} \u00b7 ${esc(l.client)}</p><h2>${esc(l.site || 'No site address')}</h2></div>
      <div class="row2">${map ? `<a class="big w" href="${map}" target="_blank" rel="noopener">Directions</a>` : ''}${l.phone ? `<a class="big w" href="tel:${esc(l.phone.replace(/\s/g, ''))}">Call ${esc((l.contact || 'client').split(' ')[0])}</a>` : ''}</div>
      <section class="card"><h3>On this load</h3><p class="mut" style="color:var(--ink)">${l.items.length ? esc(l.items.join(', ')) : 'No frames listed.'}</p><p class="mut" style="margin-top:4px">${l.count} item${l.count === 1 ? '' : 's'}${l.kg ? ' \u00b7 ' + l.kg.toLocaleString('en-NZ') + ' kg' : ''}</p>${l.note ? `<p class="mut" style="margin-top:8px"><b style="color:var(--ink)">Note from the office:</b> ${esc(l.note)}</p>` : ''}</section>
      ${l.delivered || sent ? `<section class="card"><h3>${l.delivered ? 'Delivered' : 'Sending'}</h3><p class="mut">${l.signedBy ? 'Signed by ' + esc(l.signedBy) + '.' : ''} ${sent ? 'It\u2019s saved on this phone and sends when there\u2019s signal.' : ''}</p></section>` : `
      <section class="card"><h3>Photos of the drop</h3><div class="photos">${S.photos.map((p, i) => `<span><img src="${p}" alt="Photo ${i + 1}"><button data-del="${i}" aria-label="Remove photo">\u2715</button></span>`).join('')}</div>
        <label class="big w" style="cursor:pointer">\ud83d\udcf7 Take a photo<input type="file" accept="image/*" capture="environment" id="cam" hidden></label>
        <label class="big w" style="cursor:pointer;margin-top:8px;height:46px;font-size:14px">Choose from photos<input type="file" accept="image/*" multiple id="pick" hidden></label>
        <p class="mut" style="margin-top:8px">${S.photos.length < 2 ? `At least 2 photos needed (${S.photos.length} so far). You can add more.` : `${S.photos.length} photos. Add more if you like.`}</p></section>
      <button class="big d" id="next" ${S.photos.length < 2 ? 'disabled' : ''}>Next: sign for it</button>`}</main>`;
    const take = async files => { for (const f of files) { S.photos.push(await shrink(f)); } try { LS.set('ph.' + l.loadId, S.photos); } catch (e) {} render(); };
    const c = document.getElementById('cam'); if (c) c.onchange = () => take([...c.files]);
    const pk = document.getElementById('pick'); if (pk) pk.onchange = () => take([...pk.files]);
    $app.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { S.photos.splice(+b.dataset.del, 1); LS.set('ph.' + l.loadId, S.photos); render(); });
    const nx = document.getElementById('next'); if (nx) nx.onclick = () => { S.view = 'sign'; S.sigDirty = false; render(); scrollTo(0, 0); };
    wireBack();
  }
  /* photos are made smaller on the phone, so they send quickly on site */
  async function shrink(f) {
    const url = URL.createObjectURL(f); const img = new Image(); img.src = url; await img.decode();
    const k = Math.min(1, 1600 / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); return c.toDataURL('image/jpeg', 0.8);
  }
  function signView() {
    const l = S.cur; const drv = S.signer === 'driver';
    $app.innerHTML = `${top('<span class="r">Sign</span>', 'load')}<main class="wrap">
      <h2>Who's signing?</h2>
      <button class="opt ${!drv ? 'on' : ''}" data-s="client"><i></i>The client or builder on site</button>
      <button class="opt ${drv ? 'on' : ''}" data-s="driver"><i></i>No one on site, I'll sign for them</button>
      <section class="card">${drv ? `<label class="f" for="wh">WHERE DID YOU LEAVE IT?</label><textarea class="t" id="wh" rows="2" placeholder="e.g. On the slab, north side, under cover">${esc(S.where)}</textarea><label class="f">${esc(S.me.name.toUpperCase())}, SIGN HERE</label>`
        : `<label class="f" for="nm">THEIR NAME</label><input class="t" id="nm" value="${esc(S.name)}" autocomplete="off"><label class="f">SIGN HERE</label>`}
        <div class="sig"><canvas id="pad" aria-label="Signature box"></canvas><button id="clr" type="button">Clear</button></div></section>
      <p class="mut">${drv ? 'You\u2019re signing to say the load was left on site with no one there, where you\u2019ve described.' : 'By signing, they confirm the load arrived. Missing or damaged items must be reported within 2 working days.'}</p>
      <div id="se"></div><button class="big y" id="ok">\u2713 Delivery complete</button></main>`;
    $app.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { keepText(); S.signer = b.dataset.s; render(); });
    const pad = document.getElementById('pad'); const r = pad.getBoundingClientRect(); const k = window.devicePixelRatio || 1; pad.width = r.width * k; pad.height = r.height * k;
    const x = pad.getContext('2d'); x.scale(k, k); x.lineWidth = 2.6; x.lineCap = 'round'; x.lineJoin = 'round'; x.strokeStyle = '#15171a'; S.sigDirty = false;
    let on = false; const pt = ev => { const b = pad.getBoundingClientRect(); return [ev.clientX - b.left, ev.clientY - b.top]; };
    pad.onpointerdown = ev => { on = true; pad.setPointerCapture(ev.pointerId); const [a, b] = pt(ev); x.beginPath(); x.moveTo(a, b); };
    pad.onpointermove = ev => { if (!on) return; const [a, b] = pt(ev); x.lineTo(a, b); x.stroke(); S.sigDirty = true; };
    pad.onpointerup = pad.onpointercancel = () => { on = false; };
    document.getElementById('clr').onclick = () => { x.clearRect(0, 0, pad.width, pad.height); S.sigDirty = false; };
    document.getElementById('ok').onclick = async () => {
      keepText(); const err = m => { document.getElementById('se').innerHTML = `<div class="err">${esc(m)}</div>`; };
      if (S.signer === 'client' && !S.name.trim()) return err('Add the name of who\u2019s signing.');
      if (S.signer === 'driver' && !S.where.trim()) return err('Say where you left it.');
      if (!S.sigDirty) return err('Sign in the box first.');
      if (S.photos.length < 2) return err('At least 2 photos are needed.');
      const item = { uid: `${l.loadId}-${Date.now()}`, jobId: l.jobId, loadId: l.loadId, number: l.number, n: l.n, at: Date.now(),
        signer: S.signer === 'driver' ? { type: 'driver', name: S.me.name, where: S.where.trim() } : { type: 'client', name: S.name.trim(), where: '' },
        sig: pad.toDataURL('image/png'), photos: S.photos.slice() };
      await DB.put(item); LS.del('ph.' + l.loadId);
      S.last = { site: l.site, number: l.number, who: item.signer.name, driver: S.signer === 'driver', n: S.photos.length, at: item.at };
      l.delivered = true; l.signedBy = item.signer.name; S.photos = []; S.name = ''; S.where = ''; S.signer = 'client';
      S.view = 'done'; render(); scrollTo(0, 0); S.queue = await DB.all(); badge(); flush().then(render);
    };
    wireBack();
  }
  function keepText() { const n = document.getElementById('nm'); if (n) S.name = n.value; const w = document.getElementById('wh'); if (w) S.where = w.value; }
  function doneView() {
    const d = S.last || {}; const waiting = S.queue.length > 0;
    $app.innerHTML = `<main class="wrap done"><div class="tick">\u2713</div><h2 style="margin-top:18px">Delivered</h2>
      <p class="mut" style="font-size:15px;margin-top:6px">${esc(d.site || '')}<br>${d.driver ? 'Left on site, signed by you' : 'Signed by ' + esc(d.who || '')}, ${new Date(d.at || Date.now()).toLocaleTimeString('en-NZ', { hour: 'numeric', minute: '2-digit' })}</p>
      <section class="card list" style="text-align:left;margin-top:16px">${waiting ? `<p>\u23f3 Saved on this phone</p><p>\u23f3 Sends to the office as soon as there's signal</p>` : `<p>\u2713 Signature and ${d.n} photos sent</p><p>\u2713 Saved to ${esc(d.number || 'the job')}</p><p>\u2713 The office has been told</p>`}</section>
      <button class="big d" id="bk" style="margin-top:12px">Back to my deliveries</button></main>`;
    document.getElementById('bk').onclick = () => { S.view = 'list'; load(); };
  }
  function wireBack() { $app.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { keepText(); S.view = b.dataset.go; render(); scrollTo(0, 0); }); }

  /* start */
  if (S.me) { const c = LS.get('loads'); if (c) S.loads = c.loads; S.view = 'list'; load(); } else render();
  DB.all().then(q => { S.queue = q; badge(); if (q.length) flush(); }).catch(() => {});
})();
</script>
</body>
</html>
